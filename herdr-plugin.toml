id = "followbl.drover"
name = "Drover"
version = "0.5.0"
# Requires session.snapshot, pane.read and pane.focus over the server socket.
min_herdr_version = "0.9.0"
description = "Hold Super+T to cycle Herdr tabs by recency; release to land. Two-word names for unnamed agent tabs, agent icons, status, and a live pane preview."
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "hook.py"]

[[actions]]
id = "open"
title = "Drover"
description = "Open Drover, or cycle to the next tab if it is already open"
contexts = ["global", "workspace"]
command = ["python3", "-u", "open.py"]

[[actions]]
id = "cycle-prev"
title = "Drover previous"
description = "Cycle to the previous tab if Drover is already open"
contexts = ["global", "workspace"]
command = ["python3", "-u", "open.py"]

[[actions]]
id = "title-tabs"
title = "Name unnamed agent tabs"
description = "Give every unnamed agent tab a two-word name from what its session was asked to do"
contexts = ["global"]
command = ["python3", "titles.py"]

[[panes]]
id = "switcher"
title = "Tabs"
placement = "popup"
width = "78%"
height = "72%"
command = ["python3", "-u", "switcher.py"]

[[events]]
on = "tab.focused"
command = ["python3", "hook.py"]

[[events]]
on = "tab.created"
command = ["python3", "hook.py"]

[[events]]
on = "tab.closed"
command = ["python3", "hook.py"]

[[events]]
on = "tab.renamed"
command = ["python3", "hook.py"]

[[events]]
on = "pane.created"
command = ["python3", "hook.py"]

[[events]]
on = "pane.moved"
command = ["python3", "hook.py"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "hook.py"]

# A new agent session is a tab that may need a name.
[[events]]
on = "pane.agent_detected"
command = ["python3", "hook.py"]

# Overlay keys. Copy keybindings.example.toml to the plugin config dir to remap
# without editing this file (GitHub installs replace the plugin root).
[keybindings]
select = ["Enter"]
dismiss = ["Esc"]
force_quit = ["C-c"]
move_up = ["Up", "C-p"]
move_down = ["Down", "C-n"]
move_left = ["Left"]
move_right = ["Right"]
home = ["Home", "C-a"]
end = ["End", "C-e"]
backspace = ["Backspace"]
cycle = ["C-t", "C-S-t"]
preview = ["C-o"]
cycle_prev = ["C-S-Tab"]
next = ["Tab"]
previous = ["S-Tab"]
